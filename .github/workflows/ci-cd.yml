name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-ci:
    name: Backend CI (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Run Linter (Type Check)
        run: npm run lint
        working-directory: backend

      - name: Run Tests
        run: npm run test
        working-directory: backend

  frontend-ci:
    name: Frontend CI (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Linter
        run: npm run lint
        working-directory: frontend

      - name: Run Tests
        run: npm run test
        working-directory: frontend

  build-and-push:
    name: Build & Push Docker Images
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub (only on push to main/master branches)
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and optionally Push the Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'karyakram' }}/karyakram-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'karyakram' }}/karyakram-backend:${{ github.sha }}

      # Build and optionally Push the Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'karyakram' }}/karyakram-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'karyakram' }}/karyakram-frontend:${{ github.sha }}

  deploy-to-eks:
    name: Deploy to AWS EKS
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME || 'hilarious-synth-orca' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      # Apply standard backend, frontend, and ingress manifests
      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/backend.yml
          kubectl apply -f k8s/frontend.yml
          kubectl apply -f k8s/ingress.yml

      # Dynamically update pod images to trigger a rolling update with the new commit tag
      - name: Update Pod Images & Trigger Rolling Update
        run: |
          kubectl set image deployment/karyakram-backend-deployment backend=${{ secrets.DOCKERHUB_USERNAME }}/karyakram-backend:${{ github.sha }}
          kubectl set image deployment/karyakram-frontend-deployment frontend=${{ secrets.DOCKERHUB_USERNAME }}/karyakram-frontend:${{ github.sha }}

      # Verify the rollout completes successfully (zero downtime)
      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/karyakram-backend-deployment
          kubectl rollout status deployment/karyakram-frontend-deployment
