# 1. Base64-encode your database URLs on your terminal:
#    echo -n "postgresql://..." | base64
#
# 2. Paste the encoded strings below and run:
#    kubectl apply -f secrets.yml

apiVersion: v1
kind: Secret
metadata:
  name: karyakram-secrets
type: Opaque
data:
  database-url: REPLACE_WITH_BASE64_DATABASE_URL
  direct-url: REPLACE_WITH_BASE64_DIRECT_URL
