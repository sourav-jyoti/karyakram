apiVersion: apps/v1
kind: Deployment
metadata:
  name: karyakram-backend-deployment
  labels:
    app: karyakram-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karyakram-backend
  template:
    metadata:
      labels:
        app: karyakram-backend
    spec:
      containers:
        - name: backend
          image: karyakram-backend:latest  # Tag will be updated dynamically during CD
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: FRONTEND_URL
              value: "http://karyakram-frontend-service:3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: karyakram-secrets
                  key: database-url
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: karyakram-secrets
                  key: direct-url
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: karyakram-backend-service
spec:
  selector:
    app: karyakram-backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP  # Internal only for security
